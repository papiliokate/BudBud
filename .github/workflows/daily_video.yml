name: Daily Video Generation

on:
  schedule:
    - cron: '35 9 * * *'
    - cron: '0 18 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  generate-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'

      - name: Decentralized Election
        id: election
        run: |
          ELECTION=$(node -e "
            const crypto = require('crypto');
            const d = new Date();
            const dateStr = d.toISOString().split('T')[0];
            const h = d.getUTCHours();
            
            let slotIndex = 2; // Default to slot3
            if (h >= 8 && h < 12) slotIndex = 0;
            else if (h >= 16 && h < 20) slotIndex = 1;
          
            function mulberry32(a) {
              return function() {
                var t = a += 0x6D2B79F5;
                t = Math.imul(t ^ t >>> 15, t | 1);
                t ^= t + Math.imul(t ^ t >>> 7, t | 61);
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
              }
            }
          
            const hash = crypto.createHash('md5').update(dateStr).digest('hex');
            const seedNum = parseInt(hash.substring(0, 8), 16);
            const rng = mulberry32(seedNum);
          
            const games = [0, 1, 2, 3, 4];
            for (let i = games.length - 1; i > 0; i--) {
              const j = Math.floor(rng() * (i + 1));
              [games[i], games[j]] = [games[j], games[i]];
            }
          
            console.log(games[slotIndex]);
          ")
          echo "Elected Repo ID: $ELECTION"
          
          # Bud Bud is ID 4
          if [ "$ELECTION" -ne 4 ]; then
            echo "Not elected for this slot. Exiting gracefully."
            echo "proceed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "proceed=true" >> $GITHUB_OUTPUT
          
          FORMATS=("standard" "fail" "interactive")
          SELECTED_FORMAT=${FORMATS[$(( $RANDOM % 3 ))]}
          echo "Selected Format: $SELECTED_FORMAT"
          echo "FORMAT=$SELECTED_FORMAT" >> $GITHUB_ENV

      - name: Install System Dependencies
        if: steps.election.outputs.proceed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm-dev ffmpeg
      
      - name: Install Node Dependencies
        if: steps.election.outputs.proceed == 'true'
        run: npm ci

      - name: Generate Video
        if: steps.election.outputs.proceed == 'true'
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 720x1280x24" node scripts/generate_video.js

      - name: Build Application
        if: steps.election.outputs.proceed == 'true'
        run: npm run build

      - name: Deploy to Firebase Hosting
        if: steps.election.outputs.proceed == 'true'
        run: npx firebase-tools deploy --only hosting:bud-bud --project go-rabbit-4af82 --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: Upload Video Artifact
        if: steps.election.outputs.proceed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily_video
          path: public/*.mp4
          retention-days: 1

      - name: Trigger Zapier Distribution
        if: success() && steps.election.outputs.proceed == 'true'
        run: |
          CAPTIONS=(
            "Can you match all the friends? 🤝 Play Bud Bud free at oops-games-hub.web.app"
            "The cutest logic puzzle ever! Try it free at oops-games-hub.web.app 🌸"
            "Today's Bud Bud Daily Challenge! 🌻 Are you smart enough? Play free at oops-games-hub.web.app"
          )
          YOUTUBE_TITLES=(
            "Can You Match The Buds? (#Shorts)"
            "Fastest Way To Solve Today's Logic Puzzle (#Gaming)"
            "Daily Bud Bud Puzzle (#BrainTeaser)"
          )
          R_INDEX=$(( $RANDOM % 3 ))
          CAPTION="${CAPTIONS[$R_INDEX]} #BrainTraining #DailyPuzzle #BudBud #"$(date +'%Y%m%d')
          YT_TITLE="${YOUTUBE_TITLES[$R_INDEX]}"
          TS=$(date +'%s')
          
          VIDEO_FILE=$(basename $(ls public/*.mp4 | head -n 1))
          
          curl --fail --silent --show-error -X POST -H "Content-Type: application/json" \
          -d "{\"video_url\": \"https://bud-bud.web.app/$VIDEO_FILE?t=$TS\", \"text\": \"$CAPTION\", \"youtube_title\": \"$YT_TITLE\", \"target_channel\": \"all\"}" \
          https://hooks.zapier.com/hooks/catch/27231889/ujm5mjh/ || exit 1
